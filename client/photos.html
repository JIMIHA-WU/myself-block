<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片墙 · Rover</title>
<!-- 字体：拉丁字符用 Instrument Serif（衬线斜体），中文用思源宋体；
     加载失败会自动回退系统字体，不影响页面打开 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=27">
<!--
  ============================================================
  照片墙页（v1.11 新增，原首页 #photos 区块独立成页）
  ============================================================
  规则依据 PRD §4.4：瀑布流分列（谁矮放谁）· 间距 = 图宽 1/10 ·
    圆角无边框 · 点击页面内灯箱（左右切换、点任意处关闭）。
  空态：photos 数组为空（当前素材被删）→ 显示一句说明，不留白。
  共用：styles.css（视觉一套） / app.js（发现 #photoWall 走第 6、7 节）
        / api/data.js（全站唯一取数入口）
  ============================================================
-->
</head>
<body>

<!-- ============ 顶栏（吸顶 · 毛玻璃）============ -->
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span><span id="brandName">Rover</span></a>
    <nav id="nav">
      <a href="index.html">首页</a>
      <a class="active" href="photos.html">照片墙</a>
      <a href="notes.html">记录</a>
      <a href="works.html">作品集</a>
      <a href="music.html">音乐</a>
      <a href="about.html">关于</a>
    </nav>
  </div>
</header>

<!-- ============ 照片墙 ============ -->
<section id="photos">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no">01</span>
      <h2>照片墙</h2>
      <span class="count t-min" id="photoCount"></span>
    </div>

    <!-- 三组瀑布流由 app.js 按「分组」生成（v1.12：EXPERIENCE / FUNNY / HANDSOME）。
         初始带 no-js：脚本没跑起来时这里会显示一句说明，而不是一块空白。 -->
    <div class="pw no-js" id="photoWall"></div>

    <noscript>
      <p class="t-min" style="margin-top:12px">
        当前浏览器没有执行脚本，照片墙无法显示。请开启 JavaScript 后刷新。
      </p>
    </noscript>
  </div>
</section>

<!-- ============ 照片灯箱（PRD §4.4：页面内放大 · 左右切换 · 点任意处关闭）============ -->
<div class="lightbox" id="lightbox" hidden>
  <img class="lb-img" id="lbImg" src="" alt="">
  <div class="lb-cap t-min" id="lbCap"></div>
  <button class="lb-btn lb-prev" id="lbPrev" type="button" title="上一张">‹</button>
  <button class="lb-btn lb-next" id="lbNext" type="button" title="下一张">›</button>
  <button class="lb-btn lb-close" id="lbClose" type="button" title="关闭">×</button>
</div>

<!-- ============ 页脚 ============ -->
<footer>
  <div class="wrap">
    <span class="t-min" id="footInfo"></span>
    <span class="t-min">Made by Jack</span>
  </div>
</footer>

<!-- 数据层：全站数据集中在此（TECH_DESIGN.md §12）-->
<script src="api/data.js"></script>
<!-- 渲染层：把数据写进页面 -->
<script src="app.js?v=12"></script>

</body>
</html>
