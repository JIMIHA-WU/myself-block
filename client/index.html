<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rover · to record myself</title>
<!-- 字体：拉丁字符用 Instrument Serif（衬线斜体），中文用思源宋体；
     加载失败会自动回退系统字体，不影响页面打开 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<!-- 主题无闪烁脚本（Day 8）：在样式加载前把上次选的主题定好，避免先亮后暗 -->
<script>
try {
  var t = localStorage.getItem('rover-theme');
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
} catch (e) {}
</script>
<link rel="stylesheet" href="styles.css?v=28">
<!--
  ============================================================
  首页（v1.11 板块拆分后）—— 封面 + 板块入口
  ============================================================
  区块与顺序依据 PRD.md §4.2（v1.11 变更）：
    顶栏（六项导航） → 封面 hero → 四张板块入口卡 → 页脚

  与 v1.11 之前的区别：
    ✂ 照片墙 / 记录卡片流 / 关于 已各自独立成页（photos / notes / about）
    ✂ 首页不再内嵌板块内容，只留 hero 与入口卡（PRD §4.2、§5.2 验收项）
    ✂ 导航六项全部为页面跳转：首页→照片墙→记录→作品集→音乐→关于
  ============================================================
-->
</head>
<body>

<!-- ============ 1. 顶栏（吸顶 · 毛玻璃）============ -->
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span><span id="brandName">Rover</span></a>
    <nav id="nav">
      <a class="active" href="index.html">首页</a>
      <a href="photos.html">照片墙</a>
      <a href="notes.html">记录</a>
      <a href="works.html">作品集</a>
      <a href="music.html">音乐</a>
      <a href="about.html">关于</a>
    </nav>

    <!-- 主题切换按钮（Day 8）：浅色 ↔ 深色；状态存 localStorage -->
    <button class="theme-btn" id="themeBtn" type="button"
            aria-label="切换深色 / 浅色主题" aria-pressed="false" title="切到深色">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.4 14.2A8.4 8.4 0 0 1 9.8 3.6 8.4 8.4 0 1 0 20.4 14.2z"/>
      </svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
      </svg>
    </button>
  </div>
</header>

<!-- ============ 2. 首屏 hero（2026-10-14 Jack：React Bits「Lightfall」样式前端）============
     hero 底 = Lightfall 光坠效果（原生 WebGL2 移植，见 lightfall.js），
     背景全黑（2026-10-14 晚 Jack：「整体换成全黑的」；原 #94a3b8）。
     ⚠ 文字再次下屏（2026-10-14 晚第二次指示）——
       标题 / 定位语 / 信息排三块的 hidden 属性就是开关：要加回来时删掉 hidden。 -->
<section class="hero" id="top">
  <!-- Lightfall 容器：铺满 hero；WebGL2 不可用时留纯黑底 -->
  <div class="hero-lightfall" id="lightfall" aria-hidden="true"></div>

  <!-- TechText 文字动画（React Bits TechText 原生移植，2026-10-15 Jack 指定）。
       位置：hero 正中（绝对居中覆盖层）；光标掠过字母变虚线描边、
       可拖拽字母、无鼠标时自动巡航播放。 -->
  <div class="hero-techtext" id="techText" role="img" aria-label="Welcome To"></div>

  <div class="wrap hero-inner">
    <div class="hero-title-wrap" hidden>
      <h1 class="title" id="siteName">Rover</h1>
    </div>
    <div class="slogan" id="siteSlogan" hidden>to record myself</div>

    <!-- 底部信息排（暂不上屏）-->
    <div class="hero-meta" id="heroMeta" hidden>
      <div class="subtitle" id="siteSubtitle">So you can look below.</div>
      <div class="intro" id="siteIntro"></div>

      <div class="cardfoot">
        <div class="stats" id="stats">
          <span><b>0</b> 张照片</span><span>·</span>
          <span><b>0</b> 篇笔记</span><span>·</span>
          <span><b>0</b> 天</span>
        </div>
        <div class="icons">
          <!-- GitHub -->
          <a class="icon-round" id="linkGithub" href="#" title="GitHub" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
          <!-- 邮箱 -->
          <a class="icon-round" id="linkMail" href="#" title="邮箱">
            <svg viewBox="0 0 16 16"><path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25v-8.5C0 2.784.784 2 1.75 2zM1.5 3.75v.55l6.5 3.9 6.5-3.9v-.55a.25.25 0 0 0-.25-.25H1.75a.25.25 0 0 0-.25.25zm13 2.5-6.29 3.774a.75.75 0 0 1-.42 0L1.5 6.25v6a.25.25 0 0 0 .25.25h12.5a.25.25 0 0 0 .25-.25v-6z"/></svg>
          </a>
        </div>
      </div>

      <div class="updated t-min" id="lastUpdated"></div>
    </div>
  </div>

  <div class="avatar" hidden>头像</div>
</section>

<!-- ============ 3. 板块入口（v1.11 新增；Day 8 加四态）============
     卡片由 app.js 第 5b 节从 data.js 生成，取数走 entriesAsync（模拟网络），
     因此本区具备四种状态（骨架 / 成功 / 空 / 错误+重试），
     与记录区同一套 .feed-states 机制。地址栏直达演示（截图用）：
       index.html?demo=slow   → 加载中
       index.html?demo=empty  → 空态
       index.html?demo=error  → 错误态（可点重试） -->
<section id="entriesRegion">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no">·</span>
      <h2>去看看</h2>
      <span class="count t-min">四个板块，各走各的门</span>
    </div>

    <div class="feed-states">
      <div class="feed-skel" aria-hidden="true"><div></div><div></div><div></div></div>
      <div class="feed-empty" role="status">板块列表还没准备好 —— 稍后再来看看。</div>
      <div class="feed-error" role="alert">
        <p>板块没取出来，可能是网络问题。</p>
        <button class="feed-retry" id="entriesRetry" type="button">重试</button>
      </div>
    </div>

    <div class="entries" id="entryGrid"></div>
  </div>
</section>

<!-- ============ 4. 页脚 ============ -->
<footer>
  <div class="wrap">
    <span class="t-min" id="footInfo"></span>
    <span class="t-min">Made by Jack</span>
  </div>
</footer>

<noscript>
  <p class="t-min" style="padding:14px 32px">
    当前浏览器没有执行脚本，页面内容无法加载。请开启 JavaScript 后刷新。
  </p>
</noscript>

<!-- 数据层：全站数据集中在此（TECH_DESIGN.md §12）-->
<script src="api/data.js"></script>
<!-- 渲染层：把数据写进页面 -->
<script src="app.js?v=13"></script>
<!-- Lightfall 光坠渲染层（React Bits Lightfall 原生移植，独立文件，仅首页引入） -->
<script src="lightfall.js?v=3"></script>
<!-- TechText 文字动画层（React Bits TechText 原生移植，独立文件，仅首页引入） -->
<script src="tech-text.js?v=1"></script>

</body>
</html>
