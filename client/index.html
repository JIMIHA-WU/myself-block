<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rover · to record myself</title>
<!-- 字体：拉丁字符用 Instrument Serif（衬线斜体），中文用思源宋体；
     加载失败会自动回退系统字体，不影响页面打开 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=13">
<!--
  ============================================================
  首页（v1.11 板块拆分后）—— 封面 + 板块入口
  ============================================================
  区块与顺序依据 PRD.md §4.2（v1.11 变更）：
    顶栏（六项导航） → 封面 hero → 四张板块入口卡 → 页脚

  与 v1.11 之前的区别：
    ✂ 照片墙 / 记录卡片流 / 关于 已各自独立成页（photos / notes / about）
    ✂ 首页不再内嵌板块内容，只留 hero 与入口卡（PRD §4.2、§5.2 验收项）
    ✂ 导航六项全部为页面跳转：首页→照片墙→记录→作品集→音乐→关于
  ============================================================
-->
</head>
<body>

<!-- ============ 1. 顶栏（吸顶 · 毛玻璃）============ -->
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span><span id="brandName">Rover</span></a>
    <nav id="nav">
      <a class="active" href="index.html">首页</a>
      <a href="photos.html">照片墙</a>
      <a href="notes.html">记录</a>
      <a href="works.html">作品集</a>
      <a href="music.html">音乐</a>
      <a href="about.html">关于</a>
    </nav>
  </div>
</header>

<!-- ============ 2. 首屏 hero（Prisma 式 · 保持 2026-09-29 重构后的形态）============
     站点名以满屏字号压在暗场上，信息细排在下半部 —— 不靠盒子，靠「大 · 空 · 暗」。
     底部信息排（副标题 / 自我介绍 / 数字 / 联系方式）留在首页；
     更完整的「关于」已独立成 about.html（v1.11）。 -->
<section class="hero" id="top">
  <div class="hero-bg"></div>

  <div class="wrap hero-inner">
    <div class="hero-title-wrap">
      <h1 class="title" id="siteName">Rover</h1>
    </div>
    <div class="slogan" id="siteSlogan">to record myself</div>

    <!-- 底部信息排 -->
    <div class="hero-meta" id="heroMeta">
      <div class="subtitle" id="siteSubtitle">So you can look below.</div>
      <div class="intro" id="siteIntro"></div>

      <div class="cardfoot">
        <div class="stats" id="stats">
          <span><b>0</b> 张照片</span><span>·</span>
          <span><b>0</b> 篇笔记</span><span>·</span>
          <span><b>0</b> 天</span>
        </div>
        <div class="icons">
          <!-- GitHub -->
          <a class="icon-round" id="linkGithub" href="#" title="GitHub" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
          <!-- 邮箱 -->
          <a class="icon-round" id="linkMail" href="#" title="邮箱">
            <svg viewBox="0 0 16 16"><path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25v-8.5C0 2.784.784 2 1.75 2zM1.5 3.75v.55l6.5 3.9 6.5-3.9v-.55a.25.25 0 0 0-.25-.25H1.75a.25.25 0 0 0-.25.25zm13 2.5-6.29 3.774a.75.75 0 0 1-.42 0L1.5 6.25v6a.25.25 0 0 0 .25.25h12.5a.25.25 0 0 0 .25-.25v-6z"/></svg>
          </a>
        </div>
      </div>

      <div class="updated t-min" id="lastUpdated"></div>
    </div>
  </div>

  <div class="avatar" hidden>头像</div>
</section>

<!-- ============ 3. 板块入口（v1.11 新增；卡片由 app.js 第 5b 节从 data.js 生成）============ -->
<section id="entries">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no">·</span>
      <h2>去看看</h2>
      <span class="count t-min">四个板块，各走各的门</span>
    </div>

    <div class="entries" id="entryGrid"></div>
  </div>
</section>

<!-- ============ 4. 页脚 ============ -->
<footer>
  <div class="wrap">
    <span class="t-min" id="footInfo"></span>
    <span class="t-min">Made by Jack</span>
  </div>
</footer>

<noscript>
  <p class="t-min" style="padding:14px 32px">
    当前浏览器没有执行脚本，页面内容无法加载。请开启 JavaScript 后刷新。
  </p>
</noscript>

<!-- 数据层：全站数据集中在此（TECH_DESIGN.md §12）-->
<script src="api/data.js"></script>
<!-- 渲染层：把数据写进页面 -->
<script src="app.js?v=9"></script>

</body>
</html>
